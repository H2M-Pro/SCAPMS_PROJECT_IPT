<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="assets/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
<div class="main-container">

<div class="leftside">
<img src="icons/unicap1.png" alt="Unicap1">
<section>
    <h1>SCAPMS</h1>
    <caption class="slogan">Learn.Grow.Succeed</caption>
    <h2>
        Your Future starts Here
    </h2>
    <span>Access Your Course,Asessments and More</span>
</section>
</div>

<div class="main">
<h1>Welcome Back</h1>
<h3>Sign in to your account</h3>
<br>
<form action="">
<label for="username">Username</label>
<br>
<div class="inputsdiv">
    <input type="text" name="username" id="username" placeholder="Enter your username">
    <img src="icons/usericon.png" alt="user">
      
</div>
 <span class="error_msg">error message</span>
<br> <br>
<label for="password">Password</label>
<br>
<div class="inputsdiv">
    <input type="password" name="password" id="password" placeholder="Enter your password">
    <img src="icons/showicon.png" alt="Show" id="show">
      
</div><span class="error_msg">error message</span>
<br> <br>
<section class="rem_me">
    <input type="checkbox" name="checkbox" id="checkbox">Remember me
       <a href=""> Forgot Password?</a>
</section>

<br> <br> 
<input type="button" name="button" id="btn" value="Login">
<br> <br> <br> <br>
<span class="accmsg">Don't have an account? 
    <a href="">Sign up</a>
</span>
</form>
</div>
</div>
</body>
</html>
